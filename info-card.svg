        <tspan x="40">PassaBola (Web App)</tspan>
    </text>
    <text class="line" style="animation-delay: 1.20s" y="200">
        <tspan class="key" fill="#79c0ff"> ├─</tspan>
        <tspan x="40">SkillSync (GenAI Platform)</tspan>
    </text>
    <text class="line" style="animation-delay: 1.35s" y="225">
        <tspan class="key" fill="#79c0ff"> ├─</tspan>
        <tspan x="40">Análise de Desempenho</tspan>
    </text>
